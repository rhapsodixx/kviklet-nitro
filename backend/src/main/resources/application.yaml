spring:
  liquibase:
    change-log: classpath:changelog/000-changelog.yaml
  datasource:
    url: jdbc:h2:mem:mydb;MODE=LEGACY
    username: sa
    password:
    driverClassName: org.h2.Driver
  jpa:
    properties:
      hibernate:
        auto_quote_keyword: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8081
app:
  name: "Kviklet"
  in-docker: true
  version: "dev"
  build-date: "unknown"
  git-commit: "unknown"

kviklet:
  ai-review:
    openrouter:
      api-key:
      base-url: https://openrouter.ai/api/v1
    primary-model: qwen/qwen3-coder-plus
    fallback-model: openai/gpt-4o
    timeout: 60s
    max-prompt-chars: 50000
